name: Build Kubuntu 26.04 Minimal ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Free Disk Space on Cloud Runner
      run: |
        echo "=== Cleaning unneeded runner software to maximize build space ==="
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        df -h

    - name: Install System Compilation Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin binutils gdisk rsync zstd

    - name: Set Script Permissions
      run: chmod +x build_kubuntu_hardened.sh

    - name: Run Build Script with Root Privileges
      run: |
        export GITHUB_WORKSPACE="${{ github.workspace }}"
        sudo -E ./build_kubuntu_hardened.sh

    - name: Generate Dynamic Version Tag
      id: tag
      run: |
        echo "release_tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Publish Finished ISO to GitHub Release Page
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # FIXED: Explicitly bind the auth token
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: "Kubuntu 26.04 Minimal Custom Build (${{ steps.tag.outputs.release_tag }})"
        body: |
          Automated compilation of Kubuntu 26.04 Minimal (`resolute`).
          
          **Included User Tools:**
          * Konsole
          * Dolphin
          * Kate
          
          *Built purely from scratch via debootstrap in the cloud.*
        draft: false
        prerelease: false
        files: |
          ${{ github.workspace }}/kubuntu-26.04-minimal-hardened.iso
